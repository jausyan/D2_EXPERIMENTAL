/**:
    ros__parameters:
        map_file_path: "/home/el-system/D2_EXPERIMENTAL/maps/arena_map.pcd"
        common:
            lid_topic:  "/livox/lidar_fastlio"   # from scripts/lidar_relay.py
            imu_topic:  "/rian/imu_fastlio"   # from scripts/lidar_relay.py (restamped to sim time)
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 2                # 2 for Velodyne/PointCloud2 standard
            scan_line:  64
            blind: 0.5
            timestamp_unit: 0                # 0 = seconds (lidar_relay.py writes seconds)
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    180.0
            det_range:     100.0
            extrinsic_est_en:  false      # false: use given extrinsic
            extrinsic_T: [ 0.0, 0.0, 0.0 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: true
            map_en: true
            scan_publish_en:  true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: true
            interval: -1
