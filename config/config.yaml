node:
  name: rian_drone
  mavros_namespace: /rian

lidar:
  topic: /livox/lidar
  msg_type: pointcloud2         

flight:
  takeoff_altitude: 1.3
  cruise_altitude: 1.3

gate:
  pcd_path: data/gate_sim_asli.npy       # make it with scripts/capture_gate.py + clean_gate.py
  model_center: auto                      # centre of the gate opening in the model file: auto = measured from the model
                                          # (or give [x, y, z] by hand)
  center: [2.5, 0.0, 1.3]                 # where that centre sits in the track frame (waypoints, poses)
  finish_offset_x: null                   # real field: -5.0 adds a second gate 5 m behind, simulation: null
  align_method: GICP

align:                                    # how the gate is found in the live scan
  max_range: 15.0                         # m, ignore lidar points farther than this
  search_x: [0, -1, -2, -3, -4, -6, -8]   # m, tried drone positions relative to where the model was captured
  search_y: [-1.0, 0.0, 1.0]              # m
  search_yaw_deg: [-15, 0, 15]            # deg
  coarse_voxel: 0.1                       # m, downsampling for the search
  coarse_max_dist: 1.0                    # m, GICP match distance in the search
  coarse_score_radius: 0.1                # m
  refine_top: 5                           # best candidates refined on the full cloud
  fine_max_dist: 0.3                      # m, GICP match distance in the refinement
  fine_score_radius: 0.05                 # m
  min_score: 0.5                          # 0..1, below this the scan is retried
  max_attempts: 5

arena:
  bounds: [-2.5, 17.5, -17.5, 2.5]   # x0, x1, y0, y1 of the whole arena (m): ground and click area, SAFMC 20 x 20 m
  mesh: /home/el-system/px4_ws/safmc2027_arena/meshes/arena_safmc2027.dae   # solid model shown by path_draw.py (optional)

command:                        # inter-drone orders; the strings themselves are written in mission.py
  order_topic: /mission/order   # std_msgs/String, all drones on the same ROS_DOMAIN_ID
  timeout: 300.0                # s, default wait_command timeout

# Poses defined in the gate frame (x, y, z) and transformed to the map frame
# after the gate has been aligned
poses:
  center_area: [0.0, 0.0, 1.3]
  comm_start:  [2.5, 0.0, 1.3]
  land_area:   [0.0, 1.0, 1.3]

