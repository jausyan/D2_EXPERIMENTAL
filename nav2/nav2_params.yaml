# Light Nav2: only controller_server (+ its rolling local costmap). No map, AMCL, planner or BT.
# Tune here. MPPI (Omni model) is used: it steers around cylinders on the path; DWB only stalled in front of them.
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /nav2/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 30.0        # long: the drone may slow/hover for a cylinder
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 7.0              # the drone does not steer yaw: never wait for it

    FollowPath:
      # MPPI samples many trajectories and can steer around a cylinder that sits on the path
      # (DWB just stops in front of it). Lower batch_size / time_steps for a Raspberry Pi 5.
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 50
      model_dt: 0.06                       # 3 s horizon
      batch_size: 1000
      iteration_count: 1
      motion_model: "Omni"                 # the drone moves in x and y independently
      vx_std: 0.4
      vy_std: 0.4
      wz_std: 0.05
      vx_max: 3.0
      vx_min: -0.5
      vy_max: 3.0
      wz_max: 0.05
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 0.1
      temperature: 0.3
      gamma: 0.015
      prune_distance: 6.0
      transform_tolerance: 0.5
      regenerate_noises: true
      visualize: false
      reset_period: 1.0
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        critical_cost: 200.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.1
      robot_radius: 0.35
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: cylinders
        cylinders:
          topic: /nav2/cylinders
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 7.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 1.4          # robot_radius 0.35 + about 1 m of soft margin
      always_send_full_costmap: True

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["controller_server"]
    bond_timeout: 8.0
